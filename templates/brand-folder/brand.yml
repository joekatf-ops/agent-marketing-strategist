schema_version: 3
method_version: "0.4.0"

brand:
  name: "__BRAND_NAME_YAML__"
  slug: "__BRAND_SLUG__"
  canonical_url: ""
  stage: "new"
  markets: []
  default_market: ""
  currency: ""
  owner: ""
  created: "__CREATED_DATE__"
  updated: "__CREATED_DATE__"

customer_evidence:
  status: "pre-customer"
  # pre-customer | limited | established
  own_review_count: 0
  last_research_refresh: ""

website_monitoring:
  enabled: true
  preferred_connector: "firecrawl"
  change_check: "on_open"
  incremental_changed_pages: true
  full_refresh_days: 7
  force_before: ["major_research", "concept_batch", "launch"]
  state_file: "sources/website/crawl-state.json"

naming:
  # CONTST is locked by the method. Increment after reserving every NNT, INSPO or ITR batch;
  # never reuse a number, including for a rejected, stopped or archived batch.
  test_prefix: "CONTST"
  next_test_number: 1
  brand_code: ""
  product_codes: {}
  region_codes: {}

testing_defaults:
  budget_type: "ABO"
  daily_ad_set_floor: 50
  preferred_daily_ad_set_budget: 100
  planned_observation_full_days: 5
  initial_awareness_codes: ["UWA", "PRA", "SLA", "PDA"]
  scaling_budget_type: "CBO"

run:
  language: "en-AU"
  writable: true
  output_dir: "outputs"

approvals:
  rule_approvers: []
  claim_approvers: []
