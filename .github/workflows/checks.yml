name: Checks

# The structural checks, on every push and pull request. These need no API key and no
# secrets, so they run for everybody including forks.
#
# This measures whether the package is internally consistent, which is the question that
# catches most mistakes. Ad copy quality is not measured here: copy follows the DTC Ad
# Copywriting playbook.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AGENTS.md is generated, so it must be current
        run: python3 scripts/build-agents-md.py --check

      - name: Validate the package
        run: python3 scripts/validate-package.py .

      - name: Tests
        run: python3 -m unittest discover -s tests

      - name: The shipped bundles are generated, so they must be current
        run: |
          python3 scripts/build-image-ad-bundle.py --check
          python3 scripts/validate-image-ad.py examples/image-ad-run.json
          python3 scripts/build-knowledge-bundle.py --check
